 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto: Microaprendizaje con videos cortos</title>
  <style>
    :root{
      --bg0:#05070f;
      --bg1:#0b1220;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.12);
      --text:#e5e7eb;
      --muted:#9ca3af;
      --line: rgba(255,255,255,.12);
      --a:#22c55e;
      --b:#60a5fa;
      --c:#f59e0b;
      --shadow: 0 25px 90px rgba(0,0,0,.65);
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 15% -10%, rgba(96,165,250,.35), transparent 60%),
        radial-gradient(860px 520px at 95% 10%, rgba(245,158,11,.28), transparent 60%),
        radial-gradient(700px 420px at 40% 110%, rgba(34,197,94,.22), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      display:flex;
      justify-content:center;
      padding:40px 16px;
    }

    .wrap{width:min(1050px, 100%);}

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .badge{
      align-self:flex-start;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-weight:900;
      letter-spacing:.02em;
    }

    h1{
      margin:0;
      font-size:clamp(2rem, 4vw, 3rem);
      letter-spacing:-.03em;
      line-height:1.05;
    }

    .lead{
      margin:8px 0 0;
      color: rgba(229,231,235,.86);
      line-height:1.7;
      max-width:70ch;
      font-size:1.02rem;
    }

    .layout{
      display:grid;
      grid-template-columns: 1fr;
      gap:16px;
    }

    @media (min-width: 920px){
      .layout{grid-template-columns: 1.15fr .85fr;}
    }

    .card{
      border-radius:22px;
      background:var(--card);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      padding:18px;
      overflow:hidden;
    }

    .card h2{margin:0 0 10px; font-size:1.25rem;}
    .card p{margin:0; color:var(--muted); line-height:1.7;}

    .steps{
      margin-top:14px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    @media (min-width: 620px){
      .steps{grid-template-columns: 1fr 1fr;}
    }

    .step{
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .num{
      width:38px;
      height:38px;
      border-radius:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:1000;
      background: rgba(96,165,250,.18);
      border:1px solid rgba(96,165,250,.35);
      color:#bfdbfe;
      flex:0 0 auto;
    }

    .step:nth-child(2) .num{background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.35); color:#bbf7d0;}
    .step:nth-child(3) .num{background: rgba(245,158,11,.16); border-color: rgba(245,158,11,.35); color:#fde68a;}
    .step:nth-child(4) .num{background: rgba(59,130,246,.16); border-color: rgba(59,130,246,.35); color:#dbeafe;}
