<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formularios - Registro</title>
  <style>
    :root{
      --bg:#0b1220;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.10);
      --text:#e5e7eb;
      --muted:#a7b0c0;
      --line: rgba(255,255,255,.12);
      --accent:#22c55e;
      --accent2:#3b82f6;
      --danger:#ef4444;
      --shadow: 0 22px 70px rgba(0,0,0,.55);
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(900px 420px at 15% 10%, rgba(34,197,94,.30), transparent 55%),
        radial-gradient(800px 380px at 90% 30%, rgba(59,130,246,.26), transparent 58%),
        linear-gradient(180deg, #070b15, var(--bg));
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex;
      justify-content:center;
      padding:40px 16px;
    }

    .wrap{width:min(980px,100%);}

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:14px;
      margin-bottom:18px;
    }

    h1{margin:0; font-size:clamp(1.8rem,2.6vw,2.3rem); letter-spacing:-.02em;}
    .hint{margin:6px 0 0; color:var(--muted); line-height:1.6; max-width:60ch;}

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding:18px;
    }

    form{display:grid; grid-template-columns:1fr; gap:14px;}

    @media (min-width: 860px){
      form{grid-template-columns: 1fr 1fr;}
      .full{grid-column: 1 / -1;}
    }

    label{
      display:block;
      font-weight:800;
      margin-bottom:8px;
      color:#dbeafe;
      letter-spacing:.01em;
      font-size:.95rem;
    }

    input[type="text"],
    input[type="password"],
    input[type="file"],
    select{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:var(--text);
      outline:none;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder{color: rgba(229,231,235,.55);}

    input[type="file"]{
      padding:10px;
    }

    .row{
      display:flex;
      gap:14px;
      align-items:center;
      flex-wrap:wrap;
      padding:12px;
      border-radius:14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
    }

    .row label{margin:0; color:var(--muted); font-size:.9rem; font-weight:700;}
    .row input{transform: translateY(1px);}

    .actions{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    button{
      appearance:none;
      border:0;
      padding:12px 16px;
      border-radius:14px;
      font-weight:900;
      cursor:pointer;
    }

    .primary{background: linear-gradient(90deg, var(--accent), #16a34a); color:#06210f;}
    .ghost{background: rgba(255,255,255,.06); color:var(--text); border:1px solid rgba(255,255,255,.14);}

    .primary:hover{filter:brightness(1.05);}
    .ghost:hover{background: rgba(255,255,255,.10);}

    .footer-note{
      margin-top:16px;
      color:var(--muted);
      line-height:1.7;
      font-size:.95rem;
      text-align:center;
    }

    code{background:rgba(255,255,255,.08); padding:2px 6px; border-radius:10px;}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Formulario de registro</h1>
        <p class="hint">Ejemplo de uso de campos de texto, contraseña, casillas, radios y carga de archivo. (No envía a ningún servidor.)</p>
      </div>
    </header>

    <section class="card">
      <form>
        <div>
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" placeholder="Tu nombre" />
        </div>

        <div>
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" placeholder="Tu apellido" />
        </div>

        <div>
          <label for="pass">Contraseña</label>
          <input id="pass" type="password" placeholder="••••••••" />
        </div>

        <div>
          <label for="sexo">Tipo de cuenta (radio)</label>
          <div class="row">
            <label><input type="radio" name="tipo" value="estudiante" /> Estudiante</label>
            <label><input type="radio" name="tipo" value="docente" /> Docente</label>
          </div>
        </div>

        <div class="full">
          <label>Preferencias (casillas)</label>
          <div class="row">
            <label><input type="checkbox" /> Acepto recibir correos</label>
            <label><input type="checkbox" /> Acepto el uso de datos</label>
          </div>
        </div>

        <div class="full">
          <label for="archivo">Seleccionar archivo</label>
          <input id="archivo" type="file" />
        </div>

        <div class="full actions">
          <button class="primary" type="button">Enviar</button>
          <button class="ghost" type="reset">Limpiar</button>
        </div>
      </form>

      <p class="footer-note">
        Tip: si quieres validar un formulario real, agrega <code>action</code> y <code>method</code>.
      </p>
    </section>
  </div>
</body>
</html>
